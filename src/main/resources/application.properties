spring.application.name=roomflow
spring.config.import=optional:file:./src/main/resources/application-local.properties,optional:file:./application-local.properties

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Base64-encoded random key (at least 32 bytes). Never commit the real key.
roomflow.jwt.secret=${ROOMFLOW_JWT_SECRET:}
server.error.include-message=never
server.error.include-stacktrace=never
