# Copy to application-local.properties and replace placeholders.
# The real local file is ignored by Git and excluded from JAR packaging.
spring.datasource.url=jdbc:mysql://localhost:3306/roomflow?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=YOUR_DB_USER
spring.datasource.password=YOUR_DB_PASSWORD
# JWT key: set ROOMFLOW_JWT_SECRET in the server terminal (Base64 of >=32 random bytes).
